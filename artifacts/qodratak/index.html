      /* Custom Scrollbar */
      .custom-scrollbar::-webkit-scrollbar {

      .custom-scrollbar::-webkit-scrollbar-thumb {

      /* Animations */
      @keyframes pulse-glow {
        0% { transform: scale(1); box-shadow: 0 8px 25px rgba(0, 91, 179, 0.3); }
        50% { transform: scale(1.05); box-shadow: 0 12px 35px rgba(0, 91, 179, 0.4); }
        100% { transform: scale(1); box-shadow: 0 8px 25px rgba(0, 91, 179, 0.3); }

      .sbc-badge-trigger {
        position: fixed;
        left: 10px;
        bottom: 10px;
        z-index: 60;
        display: block;
        width: 116px;
        max-width: calc(100vw - 20px);
        padding: 0;
        overflow: hidden;
        border: 0;
        border-radius: 9999px;
        background: transparent;
        box-shadow: 0 12px 26px rgba(8, 13, 28, 0.26);
        cursor: pointer;
        line-height: 0;
        transition: transform 160ms ease, box-shadow 160ms ease;
      }

      .sbc-badge-trigger:hover {
        transform: translateY(-2px);
        box-shadow: 0 16px 30px rgba(8, 13, 28, 0.34);
      }

      .sbc-badge-trigger:focus-visible {
        outline: 3px solid #91d7c5;
        outline-offset: 4px;
      }

      .sbc-badge-trigger img {
        display: block;
        width: 100%;
        height: auto;
      }

      .sbc-badge-trigger .sbc-verify-seal,
      .sbc-badge-trigger .sbc-verify-seal > a {
        position: absolute;
        inset: 0;
        z-index: 1;
        display: block;
        width: 100%;
      }

      .sbc-badge-trigger .sbc-seal-fallback {
        position: relative;
        z-index: 0;
        display: block;
        width: 100%;
        height: auto;
      }

      .sbc-certificate-backdrop {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: flex-end;
        justify-content: flex-start;
        padding: 0 10px 72px;
        overflow-y: auto;
        background: transparent;
        direction: ltr;
      }

      .sbc-certificate-dialog {
        position: relative;
        width: min(274px, calc(100vw - 20px));
        max-height: 78vh;
        overflow: auto;
        padding: 7px;
        border: 1px solid rgba(145, 215, 197, 0.42);
        border-radius: 20px;
        background: linear-gradient(160deg, #211944, #2d225a);
        box-shadow: 0 16px 38px rgba(0, 0, 0, 0.36);
        direction: rtl;
      }

      .sbc-certificate-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: 8px 8px 9px;
        color: #fff;
        direction: rtl;
        text-align: center;
      }

      .sbc-center-logo {
        display: block;
        width: 100%;
        max-height: 76px;
        height: auto;
        object-fit: contain;
        border-radius: 14px;
      }

      .sbc-certificate-card h3 {
        margin: 0;
        color: #fff;
        font-size: 14px;
        line-height: 1.45;
        font-weight: 950;
      }

      .sbc-certificate-location,
      .sbc-certificate-brand,
      .sbc-certificate-date {
        margin: 0;
        color: rgba(255, 255, 255, 0.85);
        font-size: 10px;
        line-height: 1.5;
        font-weight: 700;
      }

      .sbc-certificate-location a {
        color: #fff;
        text-decoration: underline;
        text-underline-offset: 2px;
      }

      .sbc-certificate-brand {
        color: rgba(255, 255, 255, 0.66);
        font-size: 12px;
        font-weight: 800;
      }

      .sbc-qr-frame {
        position: relative;
        width: 214px;
        padding: 7px;
        overflow: hidden;
        border-radius: 23px;
        isolation: isolate;
        background: #7053d5;
      }

      .sbc-qr-frame::before {
        position: absolute;
        inset: -60%;
        z-index: 0;
        content: "";
        background: conic-gradient(
          from 0deg,
          transparent 0deg 28deg,
          rgba(255, 255, 255, 0.3) 42deg,
          #fff 62deg 86deg,
          rgba(255, 255, 255, 0.3) 106deg,
          transparent 122deg 360deg
        );
        animation: sbc-qr-border-spin 4s linear infinite;
      }

      @keyframes sbc-qr-border-spin {
        to { transform: rotate(360deg); }
      }

      .sbc-qr-frame__inner {
        position: relative;
        z-index: 1;
        overflow: hidden;
        padding: 4px;
        border-radius: 18px;
        background: #fff;
        line-height: 0;
      }

      .sbc-qr-frame__inner img {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 13px;
      }

      .sbc-certificate-status {
        display: flex;
        align-items: center;
        gap: 5px;
        color: rgba(255, 255, 255, 0.88);
        font-size: 11px;
        font-weight: 700;
      }

      .sbc-certificate-status strong {
        padding: 2px 9px;
        color: #fff;
        border-radius: 999px;
        background: #6d58ca;
        font-size: 11px;
      }

      .sbc-certificate-link {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        width: 100%;
        margin-top: 1px;
        padding: 9px 12px;
        color: #fff;
        border: 0;
        border-radius: 12px;
        background: #7053d5;
        font-size: 12px;
        font-weight: 900;
        text-align: center;
        text-decoration: none;
        transition: background 160ms ease, transform 160ms ease;
      }

      .sbc-certificate-link:hover {
        background: #8166e4;
        transform: translateY(-1px);
      }

      @media (max-width: 640px) {
        .sbc-badge-trigger {
          left: 7px;
          bottom: max(7px, env(safe-area-inset-bottom));
          width: 104px;
        }

        .sbc-certificate-backdrop {
          padding: 0 7px max(65px, calc(env(safe-area-inset-bottom) + 58px));
        }

        .sbc-certificate-dialog {
          width: min(252px, calc(100vw - 14px));
          max-height: 76vh;
          padding: 4px;
          border-radius: 15px;
        }

        .sbc-certificate-card {
          padding: 7px 6px 8px;
        }

        .sbc-qr-frame {
          width: 198px;
        }
      }
