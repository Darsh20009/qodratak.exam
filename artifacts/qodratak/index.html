    <style>
      /* Custom Scrollbar */
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: #6a11cb;
        border-radius: 3px;
      }

      /* Animations */
      @keyframes pulse-glow {
        0% { transform: scale(1); box-shadow: 0 8px 25px rgba(0, 91, 179, 0.3); }
        50% { transform: scale(1.05); box-shadow: 0 12px 35px rgba(0, 91, 179, 0.4); }
        100% { transform: scale(1); box-shadow: 0 8px 25px rgba(0, 91, 179, 0.3); }
      }

      /* Saudi Business verification seal. The official provider element is
         kept hidden after its token is loaded; the visible mark below is
         rendered by LandingPage so the provider's white canvas can never
         leak into the page. */
      .sbc-verify-seal {
        position: absolute !important;
        width: 1px !important;
        height: 1px !important;
        overflow: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        clip: rect(0 0 0 0) !important;
        clip-path: inset(50%) !important;
      }

      .sbc-verify-seal > * {
        display: none !important;
      }

      .sbc-custom-seal {
        position: fixed;
        left: 16px;
        bottom: 16px;
        z-index: 60;
        display: inline-flex;
        align-items: center;
        gap: 9px;
        min-height: 56px;
        max-width: calc(100vw - 32px);
        padding: 8px 12px 8px 10px;
        color: #fff;
        direction: rtl;
        border: 1px solid rgba(145, 215, 197, 0.5);
        border-radius: 18px;
        background: linear-gradient(135deg, #21153f 0%, #3a2466 100%);
        box-shadow: 0 12px 26px rgba(8, 13, 28, 0.28);
        font-family: inherit;
        isolation: isolate;
      }

      .sbc-custom-seal__mark {
        display: grid;
        width: 38px;
        height: 38px;
        flex: 0 0 auto;
        place-items: center;
        color: #91d7c5;
        border-radius: 12px;
        border: 1px solid rgba(145, 215, 197, 0.62);
        background: transparent;
      }

      .sbc-custom-seal__mark svg {
        width: 28px;
        height: 28px;
      }

      .sbc-custom-seal__copy {
        display: grid;
        gap: 1px;
        text-align: right;
        white-space: nowrap;
      }

      .sbc-custom-seal__copy strong {
        font-size: 15px;
        line-height: 1.2;
        font-weight: 900;
      }

      .sbc-custom-seal__copy small {
        color: rgba(255, 255, 255, 0.72);
        font-size: 9px;
        line-height: 1.2;
        font-weight: 700;
      }

      .sbc-custom-seal__check {
        display: grid;
        width: 21px;
        height: 21px;
        flex: 0 0 auto;
        place-items: center;
        color: #172338;
        border-radius: 999px;
        background: #91d7c5;
        font-size: 14px;
        font-weight: 950;
      }

      @media (max-width: 640px) {
        .sbc-custom-seal {
          left: 10px !important;
          bottom: max(10px, env(safe-area-inset-bottom)) !important;
          min-height: 52px;
          padding: 7px 10px 7px 8px;
          border-radius: 16px;
        }

        .sbc-custom-seal__mark {
          width: 34px;
          height: 34px;
          border-radius: 10px;
        }

        .sbc-custom-seal__copy strong {
          font-size: 14px;
        }
      }
