openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: learning
    description: Foundation books, personalization, and question-bank practice
  - name: payments
    description: Sandbox Geidea checkout, reconciliation, and admin refunds
paths:
  /student/exam-reports/practice:
    post:
      operationId: startRemedialPractice
      tags: [learning]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemedialPracticeInput"
      responses:
        "200":
          description: Source-approved remedial questions without answer keys
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemedialPracticeStart"
  /student/exam-reports/practice/submit:
    post:
      operationId: submitRemedialPractice
      tags: [learning]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemedialPracticeSubmission"
      responses:
        "200":
          description: Server-owned correction and persisted learning evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemedialPracticeResult"
  /student/exam-reports:
    get:
      operationId: getStudentExamReports
      tags: [learning]
      parameters:
        - name: before
          in: query
          required: false
          schema: { type: string, minLength: 24, maxLength: 24 }
      responses:
        "200":
          description: Student-owned recent exam reports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExamReportCollection"
    post:
      operationId: saveStudentExamReport
      tags: [learning]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExamReportInput"
      responses:
        "200":
          description: Idempotent student report with source-verified correctness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExamReportSaveOutput"
  /student/exam-explanation:
    post:
      operationId: prepareExamQuestionExplanation
      tags: [learning]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExamExplanationInput"
      responses:
        "200":
          description: Saved explanation or explicit unavailable state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExamExplanationOutput"
        "429":
          description: Generation budget reached; existing explanations are still available
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: API cannot persist data because MongoDB is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /foundation/learning-state:
    get:
      operationId: getFoundationLearningState
      tags: [learning]
      summary: Get a student's starting-level assessment and recommendation
      parameters:
        - name: program
          in: query
          required: false
          schema: { type: string, enum: [qudrat, tahsili], default: qudrat }
      responses:
        "200":
          description: Current placement state for the selected program
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoundationLearningState"
        "400":
          description: Unsupported program
        "401":
          description: Authentication required
  /foundation/diagnostic:
    get:
      operationId: startFoundationPlacementAssessment
      tags: [learning]
      summary: Start a separate Qudrat or Tahsili placement assessment
      parameters:
        - name: program
          in: query
          required: false
          schema: { type: string, enum: [qudrat, tahsili], default: qudrat }
      responses:
        "200":
          description: Shuffled assessment questions without answer keys
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoundationDiagnosticStart"
        "400":
          description: Unsupported program
        "401":
          description: Authentication required
        "503":
          description: Assessment content is unavailable
  /foundation/diagnostic/submit:
    post:
      operationId: submitFoundationPlacementAssessment
      tags: [learning]
      summary: Score and save a completed placement assessment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FoundationDiagnosticSubmitRequest"
      responses:
        "201":
          description: Assessment result, confidence, and recommended starting path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoundationDiagnosticSubmission"
        "400":
          description: Invalid attempt or answer data
        "401":
          description: Authentication required
        "409":
          description: Attempt was already submitted or its question references do not match
        "410":
          description: Attempt expired or uses an obsolete assessment version
        "422":
          description: All assessment questions must be answered
  /student/learning-coach:
    get:
      operationId: getStudentLearningCoachReport
      tags: [learning]
      summary: Get trusted Qudrat and Tahsili evidence, study steps, and performance history
      responses:
        "200":
          description: Student-specific report based on approved question sources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentLearningCoachReport"
        "401":
          description: Authentication required
        "403":
          description: Students only
        "503":
          description: Report could not be prepared
  /tahsili/subject-tests/overview:
    get:
      operationId: getTahsiliSubjectTestsOverview
      tags: [learning]
      summary: Get verified Tahsili question coverage and the student's real subject performance
      responses:
        "200":
          description: Per-subject verified question counts and trusted student history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TahsiliSubjectTestsOverview"
        "401":
          description: Authentication required
        "403":
          description: Students only
        "503":
          description: Subject test information could not be loaded
  /tahsili/subject-tests/start:
    post:
      operationId: startTahsiliSubjectTest
      tags: [learning]
      summary: Start a subject-specific adaptive Tahsili test without exposing answer keys
      requestBody:
        required: true
        content:
          application/json:
            schema:
                $ref: "#/components/schemas/TahsiliSubjectTestStartInput"
      responses:
        "200":
          description: Server-selected questions and personalization rationale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TahsiliSubjectTestStartOutput"
        "400":
          description: Unsupported subject or invalid question count
        "401":
          description: Authentication required
        "403":
          description: Students only
        "503":
          description: No verified questions are available for this subject
  /tahsili/subject-tests/submit:
    post:
      operationId: submitTahsiliSubjectTest
      tags: [learning]
      summary: Score a subject test using server-owned answer keys and save trusted attempts
      requestBody:
        required: true
        content:
          application/json:
            schema:
                $ref: "#/components/schemas/TahsiliSubjectTestSubmitInput"
      responses:
        "200":
          description: Server-scored result and answer review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TahsiliSubjectTestSubmitOutput"
        "400":
          description: Invalid answers or test reference
        "401":
          description: Authentication required
        "403":
          description: Students only
        "409":
          description: Test questions have changed or are no longer verified
        "410":
          description: Test expired
  /student/learning-coach/chat:
    post:
      operationId: askStudentLearningCoach
      tags: [learning]
      summary: Ask an optional AI tutor using server-verified study context
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentLearningCoachChatRequest"
      responses:
        "200":
          description: Explanation or a safe fallback when AI is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentLearningCoachChatResponse"
        "400":
          description: Message is missing or too long
        "401":
          description: Authentication required
        "403":
          description: Students only
        "503":
          description: Trusted study context could not be loaded
  /learning/foundation-path/verbal:
    get:
      operationId: getVerbalFoundationLearningPath
      tags: [learning]
      summary: Get a personalized verbal foundation path
      responses:
        "200":
          description: Student-specific chapter priorities and question-bank coverage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoundationLearningPath"
        "401":
          description: Authentication required
        "503":
          description: Foundation book or personalization service is unavailable
  /learning/foundation-path/quantitative:
    get:
      operationId: getQuantitativeFoundationLearningPath
      tags: [learning]
      summary: Get a personalized quantitative foundation path
      responses:
        "200":
          description: Student-specific chapter priorities and question-bank coverage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoundationLearningPath"
        "401":
          description: Authentication required
        "503":
          description: Foundation book or personalization service is unavailable
  /learning/foundation-book/quantitative:
    get:
      operationId: getQudratQuantitativeBook
      tags: [learning]
      summary: Get the Qudrat quantitative pilot book and student progress
      responses:
        "200":
          description: Published lesson map and student-specific progression
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuantitativeBookOverview"
        "401":
          description: Authentication required
        "503":
          description: Book progress is unavailable
  /learning/foundation-book/quantitative/lessons/{lessonId}:
    get:
      operationId: getQudratQuantitativeBookLesson
      tags: [learning]
      summary: Get one published lesson and its current quiz set
      parameters:
        - name: lessonId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lesson content, cited sources, and unanswered quiz questions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuantitativeBookLesson"
        "400":
          description: Invalid lesson identifier
        "401":
          description: Authentication required
        "403":
          description: The lesson is still locked by the mastery sequence
        "404":
          description: Lesson is not published
        "503":
          description: Lesson progress is unavailable
  /learning/foundation-book/quantitative/lessons/{lessonId}/submit:
    post:
      operationId: submitQudratQuantitativeBookLesson
      tags: [learning]
      summary: Submit and server-grade a Qudrat quantitative lesson quiz
      parameters:
        - name: lessonId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuantitativeBookQuizInput"
      responses:
        "200":
          description: Score, worked feedback, and unlock status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuantitativeBookQuizResult"
        "400":
          description: Invalid or incomplete quiz answers
        "401":
          description: Authentication required
        "403":
          description: The lesson is locked
        "404":
          description: Lesson or current quiz set not found
        "409":
          description: The quiz submission conflicts with an earlier request
        "503":
          description: Quiz progress could not be stored
  /learning/foundation-book/verbal:
    get:
      operationId: getQudratVerbalBook
      tags: [learning]
      summary: Get the Qudrat verbal foundation book and student progress
      responses:
        "200":
          description: Published verbal lesson map and student-specific progression
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuantitativeBookOverview"
        "401":
          description: Authentication required
        "503":
          description: Book progress is unavailable
  /learning/foundation-book/verbal/files/{fileId}:
    get:
      operationId: downloadQudratVerbalBookFile
      tags: [learning]
      summary: Stream a Qudrat verbal PDF to an authenticated student
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
            enum: [sentence-completion, reading-comprehension, contextual-error, verbal-analogy]
        - name: Range
          in: header
          required: false
          description: Optional single byte range for PDF preview and resume.
          schema:
            type: string
      responses:
        "200":
          description: Complete PDF file
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "206":
          description: Requested PDF byte range
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "400":
          description: Invalid file identifier
        "401":
          description: Authentication required
        "403":
          description: Students only
        "404":
          description: PDF file not found
        "416":
          description: Invalid or unsatisfiable byte range
        "503":
          description: PDF storage is unavailable
  /learning/foundation-book/verbal/lessons/{lessonId}:
    get:
      operationId: getQudratVerbalBookLesson
      tags: [learning]
      summary: Get one published verbal lesson and its current quiz set
      parameters:
        - name: lessonId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Verbal lesson content and unanswered quiz questions, including reading passages when relevant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerbalBookLesson"
        "400":
          description: Invalid lesson identifier
        "401":
          description: Authentication required
        "403":
          description: The lesson is still locked by the mastery sequence
        "404":
          description: Lesson is not published
        "503":
          description: Lesson progress is unavailable
  /learning/foundation-book/verbal/lessons/{lessonId}/submit:
    post:
      operationId: submitQudratVerbalBookLesson
      tags: [learning]
      summary: Submit and server-grade a Qudrat verbal lesson quiz
      parameters:
        - name: lessonId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuantitativeBookQuizInput"
      responses:
        "200":
          description: Score, worked feedback, and unlock status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuantitativeBookQuizResult"
        "400":
          description: Invalid or incomplete quiz answers
        "401":
          description: Authentication required
        "403":
          description: The lesson is locked
        "404":
          description: Lesson or current quiz set not found
        "409":
          description: The quiz submission conflicts with an earlier request
        "503":
          description: Quiz progress could not be stored
  /learning/computerized/verbal/video-progress:
    get:
      operationId: getQudratVerbalVideoProgress
      tags: [learning]
      summary: Get the signed-in student's progress for the 23 verbal videos
      responses:
        "200":
          description: Saved video watch progress, including not-started videos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QudratVerbalVideoProgressSummary"
        "401":
          description: Authentication required
        "403":
          description: Students only
        "503":
          description: Video progress is unavailable
  /learning/computerized/verbal/videos/{videoId}/progress:
    post:
      operationId: recordQudratVerbalVideoProgress
      tags: [learning]
      summary: Record playback progress for one computerized verbal video
      parameters:
        - name: videoId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 80
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QudratVerbalVideoProgressInput"
      responses:
        "200":
          description: Updated student-specific playback progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QudratVerbalVideoProgress"
        "400":
          description: Invalid playback progress
        "401":
          description: Authentication required
        "403":
          description: Students only
        "404":
          description: Video is not in the published verbal video catalog
        "503":
          description: Video progress could not be saved
  /learning/foundation-test:
    post:
      operationId: createFoundationCoverageTest
      tags: [learning]
      summary: Create a personalized question-bank coverage test
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FoundationCoverageTestInput"
      responses:
        "200":
          description: A server-graded test containing unattempted bank questions first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FreeTestSession"
        "401":
          description: Authentication required
        "400":
          description: The requested category, size, or difficulty is invalid
        "404":
          description: No eligible questions are available
  /mobile/test-results:
    post:
      operationId: submitMobileFreeTest
      tags: [learning]
      summary: Submit answers for a server-owned question-bank test
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileFreeTestSubmission"
      responses:
        "201":
          description: Graded result; answered questions are recorded for learning and review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileFreeTestResult"
        "400":
          description: Test session is invalid or expired
  /subscription/geidea/sessions:
    post:
      operationId: createGeideaCheckoutSession
      tags: [payments]
      summary: Create a sandbox Geidea hosted-checkout session for the signed-in student
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeideaCheckoutSessionInput"
      responses:
        "201":
          description: A server-created checkout session; card details remain on Geidea
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeideaCheckoutSession"
        "400":
          description: Unknown plan
        "401":
          description: Authentication required
        "503":
          description: Sandbox merchant credentials are not configured
  /subscription/geidea/payments/{paymentId}:
    get:
      operationId: getGeideaPaymentStatus
      tags: [payments]
      summary: Reconcile and return the signed-in student's Geidea payment status
      parameters:
        - name: paymentId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Server-verified payment and subscription state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeideaPaymentStatus"
        "401":
          description: Authentication required
        "404":
          description: Payment not found for this student
  /payments/geidea/callback:
    post:
      operationId: receiveGeideaPaymentCallback
      tags: [payments]
      summary: Receive a Geidea callback and reconcile it against the merchant API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeideaCallbackPayload"
      responses:
        "200":
          description: Callback accepted or already reconciled
        "400":
          description: Callback is missing a recognized merchant reference
        "404":
          description: Callback does not match a known payment
        "503":
          description: Geidea could not be reached; the callback can be retried
  /admin/geidea/transactions:
    get:
      operationId: listGeideaTransactions
      tags: [payments]
      summary: List Geidea subscription payments for authorized accounting admins
      parameters:
        - name: page
          in: query
          schema: { type: number, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: number, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: Paginated payment ledger
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeideaTransactionList"
        "401":
          description: Admin authentication required
        "403":
          description: Accounting permission required
  /admin/geidea/transactions/{id}/refund:
    post:
      operationId: refundGeideaTransaction
      tags: [payments]
      summary: Refund the remaining paid balance through Geidea
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeideaRefundInput"
      responses:
        "200":
          description: Refund accepted by Geidea and recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeideaRefundResult"
        "400":
          description: Payment is not refundable or a refund is already in progress
        "401":
          description: Admin authentication required
        "403":
          description: Accounting permission required
        "404":
          description: Payment not found
components:
  schemas:
    RemedialPracticeInput:
      type: object
      required: [runId]
      properties:
        runId: { type: string, minLength: 8, maxLength: 150 }
    RemedialPracticeQuestion:
      type: object
      required: [id, text, options, category, subcategory]
      properties:
        id: { type: string }
        text: { type: string }
        category: { type: string }
        subcategory: { type: string }
        options:
          type: array
          items: { type: string }
        imageUrl: { type: string }
        passageText: { type: string }
        imageUrls:
          type: array
          items: { type: string }
    RemedialPracticeStart:
      type: object
      required: [attemptId, questions]
      properties:
        attemptId: { type: string }
        questions:
          type: array
          items:
            $ref: "#/components/schemas/RemedialPracticeQuestion"
    RemedialPracticeAnswer:
      type: object
      required: [questionId, selectedOptionIndex]
      properties:
        questionId: { type: string }
        selectedOptionIndex: { type: ["number", "null"], minimum: 0, maximum: 9 }
        responseTime: { type: number, minimum: 0, maximum: 7200 }
    RemedialPracticeSubmission:
      type: object
      required: [attemptId, answers]
      properties:
        attemptId: { type: string }
        answers:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/RemedialPracticeAnswer"
    RemedialPracticeResult:
      type: object
      required: [totalQuestions, correctAnswers, questions]
      properties:
        totalQuestions: { type: number }
        correctAnswers: { type: number }
        questions:
          type: array
          items:
            type: object
            required: [id, correctOptionIndex, isCorrect, explanation]
            properties:
              id: { type: string }
              correctOptionIndex: { type: number }
              isCorrect: { type: boolean }
              explanation: { type: string }
    ExamTimingQuestionInput:
      type: object
      required: [id, text, options, selectedOptionIndex, seconds]
      properties:
        id: { type: string, maxLength: 150 }
        text: { type: string, maxLength: 12000 }
        options:
          type: array
          maxItems: 10
          items: { type: string, maxLength: 4000 }
        selectedOptionIndex: { type: ["number", "null"], minimum: 0, maximum: 9 }
        seconds: { type: number, minimum: 0, maximum: 7200 }
        category: { type: string, maxLength: 200 }
        subcategory: { type: string, maxLength: 200 }
    ExamReportInput:
      type: object
      required: [runId, title, questions]
      properties:
        runId: { type: string, minLength: 8, maxLength: 150 }
        title: { type: string, minLength: 1, maxLength: 200 }
        questions:
          type: array
          minItems: 1
          maxItems: 250
          items:
            $ref: "#/components/schemas/ExamTimingQuestionInput"
    ExamReportTiming:
      type: object
      required: [measuredQuestions, totalSeconds, medianSeconds, slowThresholdSeconds]
      properties:
        measuredQuestions: { type: number }
        totalSeconds: { type: number }
        medianSeconds: { type: ["number", "null"] }
        slowThresholdSeconds: { type: ["number", "null"] }
    ExamReportQuestionView:
      allOf:
        - $ref: "#/components/schemas/ExamTimingQuestionInput"
        - type: object
          required: [isCorrect, correctOptionIndex, explanation, explanationStatus, speedTip, baselineSeconds, baselineSource, isSlow]
          properties:
            sourceQuestionId: { type: string }
            imageUrl: { type: string }
            passageText: { type: string }
            imageUrls:
              type: array
              items: { type: string }
            isCorrect: { type: ["boolean", "null"] }
            correctOptionIndex: { type: ["number", "null"] }
            explanation: { type: string }
            explanationStatus: { type: string }
            speedTip: { type: string }
            baselineSeconds: { type: ["number", "null"] }
            baselineSource: { type: string, enum: [student_history, this_exam] }
            isSlow: { type: boolean }
    ExamReportRecord:
      type: object
      required: [runId, title, questions, timing]
      properties:
        runId: { type: string }
        title: { type: string }
        createdAt: { type: string }
        questions:
          type: array
          items:
            $ref: "#/components/schemas/ExamReportQuestionView"
        timing:
          $ref: "#/components/schemas/ExamReportTiming"
    ExamReportSaveOutput:
      type: object
      required: [report]
      properties:
        report:
          $ref: "#/components/schemas/ExamReportRecord"
    ExamReportCollection:
      type: object
      required: [reports]
      properties:
        nextCursor: { type: ["string", "null"] }
        totalCount: { type: number, minimum: 0 }
        reports:
          type: array
          items:
            $ref: "#/components/schemas/ExamReportRecord"
    ExamExplanationInput:
