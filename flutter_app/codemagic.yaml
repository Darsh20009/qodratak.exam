workflows:
  android-debug:
    name: Qodratak Android Debug
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      flutter: stable
      vars:
        API_BASE_URL: https://qodratak.sa
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Build debug APK
        script: flutter build apk --debug --dart-define=API_BASE_URL=$API_BASE_URL
    artifacts:
      - build/app/outputs/apk/debug/*.apk

  android-internal:
    name: Qodratak Android Internal
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
      groups:
        - android_signing
        - google_play
      vars:
        PACKAGE_NAME: studio.qirox.qodratak
        API_BASE_URL: https://qodratak.sa
    scripts:
      - name: Configure Android signing
        script: |
          echo "$CM_KEYSTORE" | base64 --decode > "$CM_BUILD_DIR/android/app/qodratak-keystore.jks"
          cat > "$CM_BUILD_DIR/android/key.properties" <<EOF
          storeFile=qodratak-keystore.jks
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_PASSWORD
          EOF
      - name: Get Flutter packages
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Build Android App Bundle
        script: |
          flutter build appbundle --release \
            --build-number=$BUILD_NUMBER \
            --dart-define=API_BASE_URL=$API_BASE_URL
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/mapping/release/mapping.txt
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true

  ios-testflight:
    name: Qodratak iOS TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: studio.qirox.qodratak
      groups:
        - app_store_connect
      vars:
        BUNDLE_ID: studio.qirox.qodratak
        API_BASE_URL: https://qodratak.sa
    scripts:
      - name: Set up signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods
        script: find ios -name "Podfile" -execdir pod install \;
      - name: Analyze
        script: flutter analyze
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --dart-define=API_BASE_URL=$API_BASE_URL
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false